syntax = "proto3";
package health_data_service.v1;
option go_package = "github.com/hikata101/health_data_service/v1";

import "health_data.proto";

service Dataset {
  // Fan-out to multiple providers and stream back results in arrival order.
  rpc Download (DownloadRequest) returns (stream DownloadResponse);
  rpc Upload(stream UploadChunk) returns (UploadResponse);
  rpc List(ListDatasetsRequest) returns (ListDatasetsResponse);
}

enum ProvidersKind {
  PROVIDER_KIND_UNKNOWN = 0;
  PROVIDER_KIND_WHO_EUROPE = 1;
}

message DownloadRequest {
  // which provider to use
  ProvidersKind provider = 1;
  oneof request {
    WHOEuropeRequest who_europe = 2;
  }
  Date start_date = 3; // only year is used. When not set, get from the beginning.
  Date end_date = 4; // only year is used. When not set, use current year.
}

message Date {
  int32 year = 1;
  // int32 month = 2;
  // int32 day = 3;
}

message WHOEuropeRequest {
  health_data.v1.WHOEuropeCodes indicator = 1;
  health_data.v1.Country country = 2;
}

message DownloadResponse {
  int32 status = 1;
  oneof response {
    WHOEuropeResponse who_europe_response = 2;
  }
}

message WHOEuropeResponse {
  string csv = 1;
  string data_source = 2;
  string unit = 3;
  string representation = 4;
  repeated string data_set = 5;
  string masks = 6;
  repeated health_data.v1.WHOData data = 7;
  string last_update = 8;
  string description = 9;
  string reference_link = 10;
  string copyright = 11;
}

enum DatasetFormat {
  DATASET_FORMAT_UNKNOWN = 0;
  DATASET_FORMAT_CSV     = 1;
  DATASET_FORMAT_NETCDF  = 2;
  DATASET_FORMAT_JSON    = 3;
}

message DatasetMeta {
  string id = 1;         // server-assigned (UUID)
  string name = 2;       // client-provided filename/logical name
  DatasetFormat format = 3;
  int64 size_bytes = 4;
  string path = 5;       // server-side storage path (opaque for client)
  string created_at = 6; // RFC3339
}

// Client-streaming upload (chunked)
message UploadChunk {
  oneof body {
    DatasetMeta meta = 1;   // MUST be sent first
    bytes chunk = 2;        // raw bytes (arbitrary size chunks)
  }
}

message UploadResponse { DatasetMeta meta = 1; }

message ListDatasetsRequest {}
message ListDatasetsResponse { repeated DatasetMeta items = 1; }
